<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script type="text/javascript" src="/homey.js" data-origin="settings"></script>
  <style>
    label { display: block; margin-top: 12px; font-weight: 600; }
    input, select { width: 100%; box-sizing: border-box; padding: 6px; }
    input[type=checkbox] { width: auto; margin-right: 8px; }
    label.check { font-weight: 400; display: flex; align-items: center; }
    h2 { margin-top: 24px; font-size: 18px; }
    .hint { font-size: 13px; opacity: .7; }
    button { margin-top: 16px; margin-right: 8px; }
    #status { margin: 12px 0; font-weight: 600; }
  </style>
</head>
<body>
  <h1 data-i18n="settings.title"></h1>
  <p class="hint" data-i18n="settings.hint"></p>
  <div id="status">…</div>

  <label for="host" data-i18n="settings.tvIp"></label>
  <input id="host" placeholder="192.168.1.50">
  <label for="mac" data-i18n="settings.tvMac"></label>
  <input id="mac" placeholder="AA:BB:CC:DD:EE:FF">
  <label for="weekday" data-i18n="settings.weekdayQuota"></label>
  <input id="weekday" type="number" min="0">
  <label for="weekend" data-i18n="settings.weekendQuota"></label>
  <input id="weekend" type="number" min="0">

  <label for="weekstart" data-i18n="settings.weekStart"></label>
  <select id="weekstart">
    <option value="1" data-i18n="settings.day.d1"></option>
    <option value="2" data-i18n="settings.day.d2"></option>
    <option value="3" data-i18n="settings.day.d3"></option>
    <option value="4" data-i18n="settings.day.d4"></option>
    <option value="5" data-i18n="settings.day.d5"></option>
    <option value="6" data-i18n="settings.day.d6"></option>
    <option value="0" data-i18n="settings.day.d0"></option>
  </select>

  <h2 data-i18n="settings.autoTitle"></h2>
  <label class="check" for="autooff"><input id="autooff" type="checkbox"><span data-i18n="settings.autoOff"></span></label>
  <label class="check" for="autoon"><input id="autoon" type="checkbox"><span data-i18n="settings.autoOn"></span></label>
  <label for="autotime" data-i18n="settings.autoOnTime"></label>
  <input id="autotime" type="time" step="60">

  <button class="hy-button-primary" id="save" data-i18n="settings.save"></button>
  <button id="wake" data-i18n="settings.wake"></button>

  <script>
    function onHomeyReady(Homey) {
      var $ = function (id) { return document.getElementById(id); };
      var statusKey = { unconfigured: 'unconfigured', connecting: 'connecting', prompt: 'prompt',
        connected: 'connected', offline: 'offline' };
      var filled = false;

      function render(s) {
        $('status').textContent = Homey.__('settings.status.' + statusKey[s.connection]);
        if (!filled) {
          filled = true;
          $('host').value = s.settings.host;
          $('mac').value = s.settings.mac;
          $('weekday').value = s.settings.weekdayMinutes;
          $('weekend').value = s.settings.weekendMinutes;
          $('weekstart').value = s.settings.weekStartDay;
          $('autooff').checked = s.settings.autoOffAtRollover;
          $('autoon').checked = s.settings.autoOnEnabled;
          $('autotime').value = s.settings.autoOnTime;
          syncAutoTime();
        }
      }
      function syncAutoTime() { $('autotime').disabled = !$('autoon').checked; }
      function refresh() { Homey.api('GET', '/status', null, function (err, s) { if (!err) render(s); }); }

      $('save').addEventListener('click', function () {
        Homey.api('POST', '/configure', {
          host: $('host').value, mac: $('mac').value,
          weekdayMinutes: $('weekday').value, weekendMinutes: $('weekend').value, weekStartDay: $('weekstart').value,
          autoOffAtRollover: $('autooff').checked, autoOnEnabled: $('autoon').checked, autoOnTime: $('autotime').value,
        }, function (err, s) { if (err) Homey.alert(err.message); else render(s); });
      });
      $('autoon').addEventListener('change', syncAutoTime);
      $('wake').addEventListener('click', function () {
        Homey.api('POST', '/wake', null, function (err) { if (err) Homey.alert(err.message); });
      });

      refresh();
      setInterval(refresh, 3000);
      Homey.ready();
    }
  </script>
</body>
</html>

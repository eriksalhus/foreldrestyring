<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script type="text/javascript" src="/homey.js" data-origin="settings"></script>
  <style>
    /* Status card on top, then one card per topic. Fields have the label above. Colours follow light or dark mode. */
    :root {
      --bg: #e9ecf1;
      --surface: #ffffff;
      --surface-2: #f3f5f8;
      --ink: #1b2330;
      --ink-2: #5d6778;
      --line: #dde2ea;
      --accent: #3f86ee;
      --accent-ink: #ffffff;
      --accent-soft: #e4eefd;
      --good: #3f9b1f;
      --warn-bg: #f0b04a;
      --warn-ink: #3a2600;
      --bad-bg: #d6403a;
      --bad-ink: #ffffff;
      --track: #c3cad6;
      --shadow: 0 1px 2px rgba(20, 30, 50, .06), 0 6px 20px rgba(20, 30, 50, .06);
      --control-h: 48px;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #11151b; --surface: #1c222b; --surface-2: #252c37; --ink: #eef1f6; --ink-2: #99a3b3; --line: #2f3744;
        --accent: #5b9bf5; --accent-ink: #0c1a30; --accent-soft: #1f3150; --good: #7fcf4f;
        --warn-bg: #f0b04a; --warn-ink: #3a2600; --bad-bg: #f2736d; --bad-ink: #3a0b09;
        --track: #46505f; --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
        color-scheme: dark;
      }
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { min-height: 100%; background: var(--bg); }
    body { min-height: 100vh; margin: 0; padding: 20px 16px 32px; background: var(--bg); color: var(--ink);
      font: 15px/1.4 var(--homey-font-family, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif); }
    main { max-width: 560px; margin: 0 auto; }
    button, input, select { font: inherit; color: inherit; }

    .fs-hero { display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 18px;
      background: var(--accent); color: var(--accent-ink); transition: background .2s; }
    .fs-hero.fs-warn { background: var(--warn-bg); color: var(--warn-ink); }
    .fs-hero.fs-bad { background: var(--bad-bg); color: var(--bad-ink); }
    .fs-hero svg { flex: none; width: 36px; height: 36px; }
    .fs-hero b { display: block; font-size: 17px; }
    .fs-hero span { font-size: 14px; opacity: .85; }

    .fs-card { margin-top: 12px; padding: 16px; border-radius: 18px; background: var(--surface); box-shadow: var(--shadow); }
    .fs-card-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .fs-badge { flex: none; display: grid; place-items: center; width: 38px; height: 38px; border-radius: 11px; background: var(--accent-soft); color: var(--accent); }
    .fs-badge svg { width: 20px; height: 20px; }
    .fs-card-head h2 { margin: 0; font-size: 16px; }
    .fs-card-head p { margin: 1px 0 0; font-size: 13px; color: var(--ink-2); }
    .fs-stack { display: grid; gap: 14px; }

    label.fs-label.fs-label { display: block !important; margin: 0 0 6px !important; font-size: 13px !important; font-weight: 600 !important; line-height: 1.3 !important;
      letter-spacing: normal !important; text-transform: none !important; color: var(--ink-2) !important; }
    p.fs-hint { margin: 6px 0 0; font-size: 13px; line-height: 1.4; letter-spacing: normal; text-transform: none; color: var(--ink-2); }

    /* All fields have the same height. The browser gives number and time fields their own sizes unless we remove them. */
    .fs-field { display: block; width: 100%; height: var(--control-h); margin: 0; padding: 0 14px; border: 1px solid var(--line);
      border-radius: 12px; background: var(--surface-2); color: var(--ink); }
    input.fs-field[type=number], input.fs-field[type=time] { -webkit-appearance: none; appearance: none; }
    input[type=number] { -moz-appearance: textfield; }
    input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input.fs-field[type=time] { display: flex !important; align-items: center !important; padding-top: 0 !important; padding-bottom: 0 !important; line-height: normal; }
    input[type=time]::-webkit-date-and-time-value { text-align: left; margin: 0; min-height: 1.2em; }
    input[type=time]::-webkit-datetime-edit { padding: 0; }
    .fs-field:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: var(--accent); }

    .fs-toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 14px;
      border-radius: 12px; background: var(--surface-2); cursor: pointer; }
    label.fs-toggle-row.fs-toggle-row, label.fs-toggle-row.fs-toggle-row * { text-transform: none !important; letter-spacing: normal !important; }
    label.fs-toggle-row.fs-toggle-row { color: var(--ink) !important; font-size: 15px !important; font-weight: 400 !important; line-height: 1.4 !important; }
    .fs-toggle-row b { display: block; font-size: 15px; font-weight: 600; color: var(--ink); }
    .fs-toggle-row span.fs-d { display: block; font-size: 13px; font-weight: 400; color: var(--ink-2); }
    .fs-switch { position: relative; display: inline-flex; flex: none; width: 52px; height: 30px; }
    .fs-switch input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
    .fs-switch i { position: absolute; inset: 0; border-radius: 15px; background: var(--track); transition: background .15s; pointer-events: none; }
    .fs-switch i::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%;
      background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: transform .15s; }
    .fs-switch input:checked + i { background: var(--accent); }
    .fs-switch input:checked + i::after { transform: translateX(22px); }
    .fs-switch input:focus-visible + i { outline: 2px solid var(--accent); outline-offset: 2px; }
    .fs-toggle-row.fs-disabled { opacity: .55; cursor: default; }
    .fs-switch input:disabled { cursor: default; }

    /* Own class names and resets, so Homey's global button styles do not leak through. */
    button.fs-btn.fs-btn { -webkit-appearance: none !important; appearance: none !important; box-sizing: border-box !important;
      display: flex !important; align-items: center !important; justify-content: center !important; width: 100% !important;
      height: var(--control-h) !important; min-height: var(--control-h) !important; max-height: none !important;
      margin: 0 !important; padding: 0 20px !important; border: 0 !important; border-radius: 12px !important;
      background: var(--accent) !important; color: var(--accent-ink) !important; box-shadow: none !important;
      font: inherit !important; font-weight: 700 !important; line-height: 1.2 !important; letter-spacing: normal !important;
      text-transform: none !important; text-align: center !important; cursor: pointer; }
    button.fs-btn.fs-btn.fs-ghost { background: transparent !important; color: var(--accent) !important; border: 1.5px solid var(--line) !important; }
    button.fs-btn:disabled { opacity: .6; cursor: default; }
    button.fs-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    /* Changes are saved by themselves; a small pill confirms it. */
    .fs-saved { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
      padding: 8px 18px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow);
      font-size: 14px; font-weight: 600; color: var(--good); opacity: 0; pointer-events: none; transition: opacity .2s; }
    .fs-saved.fs-show { opacity: 1; }
  </style>
</head>
<body>
  <main>
    <div class="fs-hero" id="hero" role="status">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="4" width="19" height="13" rx="2.5"/><path d="M8 21h8M12 17v4"/></svg>
      <div><b id="status">…</b><span id="substatus"></span></div>
    </div>

    <form id="form" novalidate>
      <section class="fs-card">
        <div class="fs-card-head">
          <div class="fs-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"/><circle cx="12" cy="19" r="1"/></svg></div>
          <div><h2 data-i18n="settings.sectionTv"></h2><p data-i18n="settings.sectionTvSub"></p></div>
        </div>
        <div class="fs-stack">
          <!-- One list: the TVs in Homey first, then each TV driver that talks to a TV by IP address. -->
          <div id="drivergroup">
            <label class="fs-label" for="driver" data-i18n="settings.tvChoose"></label>
            <select class="fs-field" id="driver"></select>
            <p class="fs-hint" id="tvhint" hidden></p>
          </div>
          <!-- The other fields are drawn from the TV driver's description (GET /drivers), so each driver has its own. -->
          <div class="fs-stack" id="driverfields"></div>
          <div id="wakewrap"><button type="button" class="fs-btn fs-ghost" id="wake" data-i18n="settings.wake"></button></div>
          <p class="fs-hint" style="margin:0" id="driverhint"></p>
          <!-- On-screen messages. The switch is offered whenever messages are available; the link steps only for a Homey TV. -->
          <div class="fs-stack" id="msgbox" hidden>
            <div class="fs-stack" id="linkbox" hidden>
              <p class="fs-hint" style="margin:0" id="linkpreface" data-i18n="settings.linkPreface"></p>
              <div class="fs-stack" id="msgfields"></div>
              <p class="fs-hint" style="margin:0" id="msghint"></p>
              <button type="button" class="fs-btn fs-ghost" id="linkbtn"></button>
              <p class="fs-hint" style="margin:0" id="linkstate" role="status"></p>
            </div>
            <label class="fs-toggle-row" for="msgon" id="msgrow">
              <div><b data-i18n="settings.messages"></b><span class="fs-d" data-i18n="settings.messagesHint"></span></div>
              <span class="fs-switch"><input id="msgon" type="checkbox" role="switch"><i></i></span>
            </label>
          </div>
        </div>
      </section>

      <section class="fs-card">
        <div class="fs-card-head">
          <div class="fs-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
          <div><h2 data-i18n="settings.sectionQuota"></h2><p data-i18n="settings.sectionQuotaSub"></p></div>
        </div>
        <div class="fs-stack">
          <div>
            <label class="fs-label" for="weekday" data-i18n="settings.weekdayQuota"></label>
            <input class="fs-field" id="weekday" type="number" inputmode="numeric" min="0" max="1440">
          </div>
          <div>
            <label class="fs-label" for="weekend" data-i18n="settings.weekendQuota"></label>
            <input class="fs-field" id="weekend" type="number" inputmode="numeric" min="0" max="1440">
          </div>
          <div>
            <label class="fs-label" for="weekstart" data-i18n="settings.weekStart"></label>
            <select class="fs-field" id="weekstart">
              <option value="1" data-i18n="settings.day.d1"></option>
              <option value="2" data-i18n="settings.day.d2"></option>
              <option value="3" data-i18n="settings.day.d3"></option>
              <option value="4" data-i18n="settings.day.d4"></option>
              <option value="5" data-i18n="settings.day.d5"></option>
              <option value="6" data-i18n="settings.day.d6"></option>
              <option value="0" data-i18n="settings.day.d0"></option>
            </select>
            <p class="fs-hint" data-i18n="settings.weekStartHint"></p>
          </div>
          <div>
            <label class="fs-label" for="daystart" data-i18n="settings.dayStart"></label>
            <input class="fs-field" id="daystart" type="time" step="60">
          </div>
        </div>
      </section>

      <section class="fs-card">
        <div class="fs-card-head">
          <div class="fs-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 3 5 13.5h6L10 21l8-10.5h-6z"/></svg></div>
          <div><h2 data-i18n="settings.autoTitle"></h2><p id="autosub"></p></div>
        </div>
        <div class="fs-stack">
          <label class="fs-toggle-row" for="autooff">
            <div><b data-i18n="settings.autoOff"></b><span class="fs-d" id="autoffhint"></span></div>
            <span class="fs-switch"><input id="autooff" type="checkbox" role="switch"><i></i></span>
          </label>
          <label class="fs-toggle-row" for="autoon">
            <div><b data-i18n="settings.autoOn"></b><span class="fs-d" data-i18n="settings.autoOnHint"></span></div>
            <span class="fs-switch"><input id="autoon" type="checkbox" role="switch"><i></i></span>
          </label>
          <div id="autotimegroup" hidden>
            <label class="fs-label" for="autotime" data-i18n="settings.autoOnTime"></label>
            <input class="fs-field" id="autotime" type="time" step="60">
          </div>
        </div>
      </section>

      <div class="fs-saved" id="saved" role="status" data-i18n="settings.saved"></div>
    </form>
  </main>

  <script>
    function onHomeyReady(Homey) {
      var $ = function (id) { return document.getElementById(id); };
      // [hero class, text key]
      var connection = {
        unconfigured: ['fs-bad', 'unconfigured'], connecting: ['fs-warn', 'connecting'], prompt: ['fs-warn', 'prompt'],
        connected: [''  , 'connected'], offline: ['fs-bad', 'offline'],
      };
      var filled = false;
      var savedTimer = null;
      var drivers = [];
      var tvDevices = []; // the TVs in Homey, from GET /tv-devices
      var msgStore = {}; // values of the message provider's fields (the TV's IP address)
      var msgKey = null; // which TV and provider msgStore belongs to
      var msgState = null; // the messages part of the last status
      var values = {}; // driver id → { field key → value }, so what was typed survives switching brand
      var currentDriver = null;
      var lastSettings = null; // what the app has stored
      var saving = false;
      var unsaved = false; // something was changed that has not been sent yet
      var resend = false; // changed again while a save was on its way

      function driverById(id) {
        for (var i = 0; i < drivers.length; i++) if (drivers[i].id === id) return drivers[i];
        return null;
      }
      // A driver with a `device` field is chosen by picking one of the TVs in Homey; its other fields are drawn as usual.
      function deviceField(d) {
        for (var i = 0; i < d.fields.length; i++) if (d.fields[i].kind === 'device') return d.fields[i];
        return null;
      }
      function tvById(id) {
        for (var i = 0; i < tvDevices.length; i++) if (tvDevices[i].id === id) return tvDevices[i];
        return null;
      }
      function tvLabel(tv) { return tv.zone ? tv.name + ' · ' + tv.zone : tv.name; }
      // The options of the Connected TV list. A value is "driverId" or "driverId|deviceId". Returns the value to select.
      function renderChoices(settings) {
        var select = $('driver');
        while (select.firstChild) select.removeChild(select.firstChild);
        var wanted = settings.driver;
        var chosen = null;
        var add = function (value, label) {
          var option = el('option', '', label);
          option.value = value;
          select.appendChild(option);
        };
        drivers.forEach(function (d) {
          var field = deviceField(d);
          if (!field) {
            add(d.id, Homey.__('settings.byIpAddress', { name: d.name }));
            if (d.id === wanted) chosen = d.id;
            return;
          }
          var saved = d.id === wanted ? (settings.driverConfig[field.key] || '') : '';
          tvDevices.forEach(function (tv) {
            add(d.id + '|' + tv.id, tvLabel(tv));
            if (saved === tv.id) chosen = d.id + '|' + tv.id;
          });
          // The saved TV is gone from Homey: keep showing it, so the choice is never silently changed.
          if (saved && !tvById(saved)) {
            add(d.id + '|' + saved, Homey.__('settings.tvGone'));
            chosen = d.id + '|' + saved;
          }
        });
        $('tvhint').hidden = tvDevices.length > 0 || !drivers.some(deviceField);
        $('tvhint').textContent = Homey.__('settings.noHomeyTvs');
        // Nothing saved for this driver yet (a new installation): the first TV in Homey, else the first entry.
        if (!chosen && select.firstChild) chosen = select.firstChild.value;
        select.value = chosen;
        return chosen;
      }
      function applyChoice(value) {
        var parts = value.split('|');
        var d = driverById(parts[0]);
        if (!d) return;
        var field = deviceField(d);
        values[d.id] = values[d.id] || {};
        if (field) values[d.id][field.key] = parts[1] || '';
        renderDriver(d.id);
      }
      function el(tag, cls, text) {
        var node = document.createElement(tag);
        if (cls) node.className = cls;
        if (text) node.textContent = text;
        return node;
      }
      // Draws the fields of the selected TV driver. Text is set with textContent, never innerHTML.
      // Draws a text box per field. Values go to `store` and are saved when the user leaves the field.
      function drawFields(box, fields, store, prefix) {
        while (box.firstChild) box.removeChild(box.firstChild);
        fields.forEach(function (f) {
          if (f.kind === 'device') return; // chosen in the Connected TV list
          var wrap = el('div');
          var label = el('label', 'fs-label', f.label);
          label.htmlFor = prefix + f.key;
          var input = el('input', 'fs-field');
          input.id = prefix + f.key;
          input.autocomplete = 'off';
          input.setAttribute('inputmode', f.inputMode);
          input.placeholder = f.placeholder;
          input.value = store[f.key] || '';
          input.autocapitalize = 'off';
          input.spellcheck = false;
          input.addEventListener('input', function () { store[f.key] = input.value; unsaved = true; });
          input.addEventListener('change', saveNow);
          wrap.appendChild(label);
          wrap.appendChild(input);
          if (f.hint) wrap.appendChild(el('p', 'fs-hint', f.hint));
          box.appendChild(wrap);
        });
      }
      function renderDriver(id) {
        var d = driverById(id);
        if (!d) return;
        currentDriver = d.id;
        var mine = values[d.id] = values[d.id] || {};
        drawFields($('driverfields'), d.fields, mine, 'f_');
        $('wakewrap').hidden = !d.canWake;
        $('driverhint').textContent = d.hint;
        $('driverhint').hidden = !d.hint;
      }

      // What the page sends about messages: the switch always, and the provider's fields for a Homey TV.
      function messagesBody() {
        if (!msgState || msgState.mode === 'none') return undefined;
        var body = { enabled: $('msgon').checked };
        if (msgState.mode === 'provider') body.config = msgStore;
        return body;
      }
      // Messages need a one-time link for a Homey TV. Until then the switch is greyed out and the explanation is shown.
      function renderMessages(s) {
        var m = msgState = s.messages;
        $('msgbox').hidden = m.mode === 'none';
        $('linkbox').hidden = m.mode !== 'provider';
        if (m.mode === 'none') return;
        var locked = false;
        if (m.mode === 'provider') {
          var key = s.settings.driver + '|' + JSON.stringify(s.settings.driverConfig) + '|' + m.provider.id;
          if (key !== msgKey) { // another TV: start from what is saved, else from what the device knows
            msgKey = key;
            msgStore = {};
            m.provider.fields.forEach(function (f) { msgStore[f.key] = m.config[f.key] || m.suggested[f.key] || ''; });
            drawFields($('msgfields'), m.provider.fields, msgStore, 'm_');
            $('msghint').textContent = m.provider.hint;
            $('msghint').hidden = !m.provider.hint;
          }
          locked = !m.linked;
          $('linkpreface').hidden = m.linked;
          $('linkbtn').textContent = Homey.__(m.linked ? 'settings.unlink' : 'settings.link');
          var state = m.linked ? 'linked' : { connecting: 'connecting', prompt: 'prompt', offline: 'unreachable' }[m.connection];
          $('linkstate').textContent = state ? Homey.__('settings.linkState.' + state) : '';
          $('linkstate').hidden = !state;
        }
        if (!saving) $('msgon').checked = m.enabled;
        $('msgon').disabled = locked;
        $('msgrow').classList.toggle('fs-disabled', locked);
      }

      // The reset texts follow the time the user chose for when the day begins.
      function syncDayStart() {
        var time = $('daystart').value || '05:00';
        $('autosub').textContent = Homey.__('settings.autoSub', { time: time });
        $('autoffhint').textContent = Homey.__('settings.autoOffHint', { time: time });
      }
      function syncAutoTime() { $('autotimegroup').hidden = !$('autoon').checked; }

      function render(s) {
        lastSettings = s.settings;
        var c = s.tvMissing ? ['fs-bad', 'missing'] : connection[s.connection];
        $('hero').className = 'fs-hero ' + c[0];
        $('status').textContent = Homey.__('settings.status.' + c[1]);
        var parts = [];
        if (s.configured && s.connection === 'connected') parts.push(Homey.__(s.tvOn ? 'widget.tvOn' : 'widget.tvOff'));
        var d = driverById(s.settings.driver);
        var dev = d && deviceField(d);
        if (dev) {
          var chosenId = s.settings.driverConfig[dev.key];
          var tv = tvById(chosenId);
          if (chosenId) parts.push(tv ? tv.name : Homey.__('settings.tvGone'));
        } else if (d) {
          if (drivers.length > 1) parts.push(d.name);
          if (d.fields.length) parts.push(s.settings.driverConfig[d.fields[0].key]);
        }
        $('substatus').textContent = parts.filter(Boolean).join(' · ');
        renderMessages(s);
        if (filled) return; // do not overwrite what the user is typing
        filled = true;
        values[s.settings.driver] = s.settings.driverConfig;
        applyChoice(renderChoices(s.settings));
        $('weekday').value = s.settings.weekdayMinutes;
        $('weekend').value = s.settings.weekendMinutes;
        $('daystart').value = s.settings.dayStartTime;
        $('weekstart').value = s.settings.weekStartDay;
        $('autooff').checked = s.settings.autoOffAtRollover;
        $('autoon').checked = s.settings.autoOnEnabled;
        $('autotime').value = s.settings.autoOnTime;
        syncAutoTime();
        syncDayStart();
        // A new installation: the first TV in Homey is preselected, so it is also saved.
        if (!s.configured && currentDriver) saveNow();
      }
      function refresh() { Homey.api('GET', '/status', null, function (err, s) { if (!err) render(s); }); }

      function showSaved() {
        $('saved').classList.add('fs-show');
        clearTimeout(savedTimer);
        savedTimer = setTimeout(function () { $('saved').classList.remove('fs-show'); }, 3000);
      }

      function validQuota(id) { return /^\d+$/.test($(id).value) && Number($(id).value) <= 1440; }
      // Only a complete, valid form is saved, so a half-typed value never replaces a working setup.
      function canSave() {
        var d = driverById(currentDriver);
        if (!filled || !d) return false;
        var mine = values[currentDriver] || {};
        for (var i = 0; i < d.fields.length; i++) {
          if (d.fields[i].required && !String(mine[d.fields[i].key] || '').trim()) return false;
        }
        return validQuota('weekday') && validQuota('weekend') && Boolean($('daystart').value) &&
          (!$('autoon').checked || Boolean($('autotime').value));
      }
      function saveNow() {
        if (!canSave()) return;
        if (saving) { resend = true; return; }
        saving = true;
        resend = false;
        unsaved = false;
        Homey.api('POST', '/configure', {
          driver: currentDriver, driverConfig: values[currentDriver] || {},
          weekdayMinutes: $('weekday').value, weekendMinutes: $('weekend').value,
          dayStartTime: $('daystart').value, weekStartDay: $('weekstart').value,
          autoOffAtRollover: $('autooff').checked, autoOnEnabled: $('autoon').checked, autoOnTime: $('autotime').value,
          messages: messagesBody(),
        }, function (err, s) {
          saving = false;
          if (err) { unsaved = true; Homey.alert(err.message); return; }
          render(s);
          showSaved();
          if (resend) saveNow();
        });
      }
      function showSaved() {
        $('saved').classList.add('fs-show');
        clearTimeout(savedTimer);
        savedTimer = setTimeout(function () { $('saved').classList.remove('fs-show'); }, 2000);
      }
      // Text, number and time fields save when the user leaves the field (the browser fires `change` then).
      function autosave(id) {
        $(id).addEventListener('input', function () { unsaved = true; });
        $(id).addEventListener('change', saveNow);
      }
      // A field left empty or invalid goes back to what is stored, instead of silently not saving.
      function restoreOnBlur(id, valid, stored) {
        $(id).addEventListener('blur', function () {
          if (!valid(id) && lastSettings) $(id).value = stored(lastSettings);
        });
      }

      $('driver').addEventListener('change', function () { applyChoice($('driver').value); saveNow(); });
      $('autoon').addEventListener('change', function () { syncAutoTime(); saveNow(); });
      $('autooff').addEventListener('change', saveNow);
      $('msgon').addEventListener('change', saveNow);
      // Link starts the connection so the user can press "Allow" on the TV; nothing contacts the TV before this.
      $('linkbtn').addEventListener('click', function () {
        var linked = msgState && msgState.linked;
        $('linkbtn').disabled = true;
        Homey.api('POST', linked ? '/messages/unlink' : '/messages/link', linked ? null : { config: msgStore }, function (err, s) {
          $('linkbtn').disabled = false;
          if (err) { Homey.alert(err.message); return; }
          render(s);
        });
      });
      $('weekstart').addEventListener('change', saveNow);
      ['weekday', 'weekend', 'daystart', 'autotime'].forEach(autosave);
      restoreOnBlur('weekday', validQuota, function (st) { return st.weekdayMinutes; });
      restoreOnBlur('weekend', validQuota, function (st) { return st.weekendMinutes; });
      restoreOnBlur('daystart', function (id) { return Boolean($(id).value); }, function (st) { return st.dayStartTime; });
      restoreOnBlur('autotime', function (id) { return Boolean($(id).value); }, function (st) { return st.autoOnTime; });
      $('daystart').addEventListener('input', syncDayStart);
      $('daystart').addEventListener('change', syncDayStart);
      $('form').addEventListener('submit', function (e) { e.preventDefault(); saveNow(); });
      // Leaving the page while a field still has focus: send the change now.
      document.addEventListener('visibilitychange', function () { if (document.hidden && unsaved) saveNow(); });
      window.addEventListener('pagehide', function () { if (unsaved) saveNow(); });
      $('wake').addEventListener('click', function () {
        Homey.api('POST', '/wake', null, function (err) { if (err) Homey.alert(err.message); });
      });

      // The drivers and the TVs in Homey must be loaded before the first status, because the list and fields are drawn from them.
      Homey.api('GET', '/drivers', null, function (err, list) {
        if (!err && list) drivers = list;
        Homey.api('GET', '/tv-devices', null, function (err2, tvs) {
          if (!err2 && tvs) tvDevices = tvs;
          refresh();
          setInterval(refresh, 3000);
        });
      });
      Homey.ready();
    }
  </script>
</body>
</html>

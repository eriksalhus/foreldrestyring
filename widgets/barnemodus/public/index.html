<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script type="text/javascript" src="/homey.js" data-origin="widget"></script>
  <style>
    :root { --accent: #2b6cb0; --warn: #d98a00; --danger: #d93025; --track: rgba(127, 127, 127, .25); }
    * { box-sizing: border-box; }
    html, body { overflow: hidden; }
    body { border: 1px solid rgba(127, 127, 127, .4); border-radius: 16px; transition: background-color .3s; }
    html.on body { background-color: rgba(43, 108, 176, .18); }
    html.locked body { background-color: rgba(217, 48, 37, .18); }
    body { margin: 0; padding: 16px; font-family: var(--homey-font-family, sans-serif); color: var(--homey-text-color); }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .muted { opacity: .7; font-size: 13px; }
    .title { display: flex; align-items: center; gap: 10px; font-size: 16px; opacity: .75; }
    .icon { flex: none; width: 22px; height: 22px; }
    .state { margin-top: 6px; font-size: 18px; }

    /* Toggle */
    .switch { position: relative; flex: none; width: 56px; height: 32px; padding: 0; border: 0; border-radius: 16px;
      background: var(--track); transition: background .15s; cursor: pointer; }
    .switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%;
      background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .35); transition: transform .15s; }
    .switch[aria-checked="true"] { background: var(--accent); }
    .switch[aria-checked="true"]::after { transform: translateX(24px); }

    /* Time */
    .big { font-size: 34px; font-weight: 700; line-height: 1.1; margin-top: 20px; }
    .big.low { color: var(--warn); }
    .big.locked { color: var(--danger); }
    .bar { height: 8px; margin: 12px 0 4px; border-radius: 4px; background: var(--track); overflow: hidden; }
    .bar > div { height: 100%; width: 0; border-radius: 4px; background: var(--accent); transition: width .3s; }
    .bar.low > div { background: var(--warn); }
    .bar.locked > div { background: var(--danger); }

    /* Extra time */
    .extra { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0 0; }
    .extra button { min-height: 48px; font-size: 17px; font-weight: 600; border: 0; border-radius: 12px;
      background: var(--accent); color: #fff; cursor: pointer; }
    .extra button:active { opacity: .75; }
    .label { margin-top: 24px; font-size: 13px; opacity: .7; }

    .link { border: 0; background: none; padding: 6px 0; font: inherit; font-size: 13px; color: inherit; opacity: .7; text-decoration: underline; cursor: pointer; }
    .off .big, .off .bar { opacity: .45; }

    /* Tilkoblingsprikk */
    .status { display: flex; align-items: center; gap: 16px; }
    .conn { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
    .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--danger); }
    .dot.ok { background: #1e9e4a; }

    /* Statistikk */
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 24px 0 20px; }
    .tile { padding: 10px 12px; border-radius: 12px; background: var(--track); }
    .tile .value { font-size: 22px; font-weight: 700; line-height: 1.2; }
    .tile .unit { font-size: 13px; font-weight: 500; opacity: .7; }
    .tile .name { font-size: 12px; opacity: .7; text-transform: uppercase; letter-spacing: .04em; }
    .tile .sub { font-size: 12px; opacity: .7; margin-top: 2px; }
  </style>
</head>
<body>
  <div class="row">
    <div>
      <div class="title">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="4" width="18" height="12" rx="2"/><path d="M9 20h6"/><circle cx="12" cy="10" r="3"/><path d="M12 8.6V10l1 .7"/>
        </svg>
        <span>Barnemodus</span>
      </div>
      <div class="state" id="state">…</div>
    </div>
    <button class="switch" id="toggle" role="switch" aria-checked="false" aria-label="Barnemodus"></button>
  </div>

  <div id="body">
    <div class="big" id="remaining">–</div>
    <div class="bar" id="bar"><div id="fill"></div></div>
  </div>

  <div class="label">Gi ekstra tid</div>
  <div class="extra">
    <button data-min="10">+10</button>
    <button data-min="15">+15</button>
    <button data-min="30">+30</button>
  </div>

  <div class="stats">
    <div class="tile">
      <div class="name">I dag</div>
      <div class="value"><span id="today">–</span> <span class="unit">min brukt</span></div>
      <div class="sub" id="todaySub"></div>
    </div>
    <div class="tile">
      <div class="name">Denne uka</div>
      <div class="value"><span id="week">–</span> <span class="unit">min brukt</span></div>
    </div>
  </div>

  <div class="row">
    <div class="status">
      <div class="muted conn"><span class="dot" id="connDot"></span><span id="conn"></span></div>
      <div class="muted conn"><span class="dot" id="tvDot"></span><span id="tv"></span></div>
    </div>
    <button class="link" id="reset">Nullstill</button>
  </div>

  <script>
    function onHomeyReady(Homey) {
      var status = null;
      var $ = function (id) { return document.getElementById(id); };
      var connText = { unconfigured: 'Ikke satt opp', connecting: 'Ikke tilkoblet', prompt: 'Trykk «Tillat» på TV',
        connected: 'Tilkoblet', offline: 'Ikke tilkoblet' };

      function render(s) {
        status = s;
        var total = s.quotaMinutes + s.extraMinutes;
        var low = s.childMode && !s.locked && s.remainingMinutes <= 5;

        $('toggle').setAttribute('aria-checked', String(s.childMode));
        $('state').textContent = s.childMode ? (s.locked ? 'På · låst' : 'På') : 'Av · ingen telling eller lås';
        $('body').className = s.childMode ? '' : 'off';
        document.documentElement.classList.toggle('locked', s.locked);
        document.documentElement.classList.toggle('on', s.childMode && !s.locked);

        $('remaining').textContent = s.locked ? 'Låst' : s.remainingMinutes + ' min igjen';
        $('remaining').className = 'big' + (s.locked ? ' locked' : low ? ' low' : '');
        $('bar').className = 'bar' + (s.locked ? ' locked' : low ? ' low' : '');
        $('fill').style.width = (total > 0 ? Math.min(100, Math.round(100 * s.usedMinutes / total)) : 100) + '%';
        $('today').textContent = s.usedMinutes;
        $('todaySub').textContent = 'av ' + total + ' min' + (s.extraMinutes ? ' (inkl. ' + s.extraMinutes + ' ekstra)' : '');
        $('week').textContent = s.weekUsedMinutes;
        var connected = s.connection === 'connected';
        $('connDot').className = 'dot' + (connected ? ' ok' : '');
        $('conn').textContent = connText[s.connection];
        $('tvDot').className = 'dot' + (connected && s.tvOn ? ' ok' : '');
        $('tv').textContent = connected && s.tvOn ? 'TV på' : 'TV av';
      }
      function call(method, path, body) {
        return Homey.api(method, path, body || {})
          .then(function (s) { render(s); })
          .catch(function (err) { $('connDot').className = 'dot'; $('tvDot').className = 'dot'; $('conn').textContent = 'Feil: ' + (err && err.message || err); });
      }
      function refresh() { return call('GET', '/status'); }

      $('toggle').addEventListener('click', function () {
        if (!status) return;
        var on = !status.childMode;
        $('toggle').setAttribute('aria-checked', String(on)); // umiddelbar respons
        call('POST', '/child-mode', { on: on });
      });
      Array.prototype.forEach.call(document.querySelectorAll('[data-min]'), function (b) {
        b.addEventListener('click', function () { call('POST', '/extra-time', { minutes: Number(b.dataset.min) }); });
      });

      var resetTimer = null;
      $('reset').addEventListener('click', function () {
        if (resetTimer) {
          clearTimeout(resetTimer); resetTimer = null;
          $('reset').textContent = 'Nullstill';
          call('POST', '/reset-today');
        } else {
          $('reset').textContent = 'Trykk igjen';
          resetTimer = setTimeout(function () { resetTimer = null; $('reset').textContent = 'Nullstill'; }, 4000);
        }
      });

      $('conn').textContent = 'Henter status …';
      // Høyden måles etter første visning, så innholdet aldri trenger å skrolles.
      refresh().then(function () {
        Homey.ready({ height: Math.ceil(document.documentElement.scrollHeight) });
      });
      setInterval(refresh, 10000);
    }
  </script>
</body>
</html>

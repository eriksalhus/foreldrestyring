<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script type="text/javascript" src="/homey.js" data-origin="widget"></script>
  <style>
    /* Mål tatt fra Homeys egne widgeter: tittel 17px fet, undertittel 14px dempet, verdier 20-24px fet. */
    :root {
      --text: var(--homey-text-color, #e4e4e7);
      --accent: #5399f4;
      --good: #87d23f;
      --warn: #f5a623;
      --danger: #f2564d;
      --muted: .62;
      --tile: rgba(127, 127, 127, .14);
      --track: rgba(127, 127, 127, .25);
    }
    * { box-sizing: border-box; }
    html, body { overflow: hidden; }
    html { height: 100%; }
    body { margin: 0; padding: 16px; min-height: 100%; border-radius: 16px; transition: background-color .3s;
      font-family: var(--homey-font-family, sans-serif); font-size: 14px; color: var(--text); }
    html.on body { background-color: rgba(83, 153, 244, .14); }
    html.locked body { background-color: rgba(242, 86, 77, .14); }

    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .muted { opacity: var(--muted); }

    /* Topp: ikon, tittel, undertittel og bryter */
    .head { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .icon { flex: none; width: 28px; height: 28px; color: var(--text); }
    .title { font-size: 17px; font-weight: 700; line-height: 1.25; }
    .state { font-size: 14px; line-height: 1.3; opacity: var(--muted); }
    .state.good { color: var(--good); opacity: 1; }
    .state.bad { color: var(--danger); opacity: 1; }

    .switch { position: relative; flex: none; width: 52px; height: 30px; padding: 0; border: 0; border-radius: 15px;
      background: var(--track); transition: background .15s; cursor: pointer; }
    .switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%;
      background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .35); transition: transform .15s; }
    .switch[aria-checked="true"] { background: var(--accent); }
    .switch[aria-checked="true"]::after { transform: translateX(22px); }

    /* Tid igjen */
    .big { font-size: 24px; font-weight: 700; line-height: 1.2; margin-top: 20px; }
    .big.low { color: var(--warn); }
    .big.locked { color: var(--danger); }
    .bar { height: 8px; margin: 10px 0 0; border-radius: 4px; background: var(--track); overflow: hidden; }
    .bar > div { height: 100%; width: 0; border-radius: 4px; background: var(--text); transition: width .3s; }
    .bar.low > div { background: var(--warn); }
    .bar.locked > div { background: var(--danger); }
    .off .big, .off .bar { opacity: .45; }

    /* Ekstra tid */
    .label { margin-top: 24px; font-size: 14px; opacity: var(--muted); }
    .extra { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
    .extra button { min-height: 44px; font: inherit; font-size: 17px; font-weight: 600; border: 0; border-radius: 12px;
      background: rgba(127, 127, 127, .2); color: var(--text); cursor: pointer; }
    .extra button:active:not(:disabled) { background: rgba(127, 127, 127, .35); }
    .extra button:disabled { opacity: .35; cursor: default; }

    /* Statistikk */
    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 24px 0 20px; }
    .tile { padding: 12px 14px; border-radius: 16px; background: var(--tile); }
    .tile .name { font-size: 14px; font-weight: 500; opacity: var(--muted); }
    .tile .value { margin-top: 2px; font-size: 20px; font-weight: 700; line-height: 1.3; }
    .tile .unit { font-size: 14px; font-weight: 500; opacity: var(--muted); }
    .tile .sub { margin-top: 2px; font-size: 12px; opacity: var(--muted); }

    /* Bunnlinje */
    .status { display: flex; align-items: center; gap: 16px; }
    .conn { display: flex; align-items: center; gap: 6px; white-space: nowrap; font-size: 14px; }
    .conn span:last-child { opacity: var(--muted); }
    .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--danger); }
    .dot.ok { background: var(--good); }
    .link { border: 0; background: none; padding: 6px 0; font: inherit; font-size: 14px; color: inherit; opacity: var(--muted);
      text-decoration: underline; cursor: pointer; }
  </style>
</head>
<body>
  <div id="app">
  <div class="row">
    <div class="head">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4" width="18" height="12" rx="2"/><path d="M9 20h6"/><circle cx="12" cy="10" r="3"/><path d="M12 8.6V10l1 .7"/>
      </svg>
      <div>
        <div class="title" data-i18n="title"></div>
        <div class="state" id="state">…</div>
      </div>
    </div>
    <button class="switch" id="toggle" role="switch" aria-checked="false"></button>
  </div>

  <div id="body">
    <div class="big" id="remaining">–</div>
    <div class="bar" id="bar"><div id="fill"></div></div>
  </div>

  <div class="label" data-i18n="extraTime"></div>
  <div class="extra">
    <button data-min="10" disabled>+10</button>
    <button data-min="15" disabled>+15</button>
    <button data-min="30" disabled>+30</button>
  </div>

  <div class="stats">
    <div class="tile">
      <div class="name" data-i18n="today"></div>
      <div class="value"><span id="today">–</span> <span class="unit" data-i18n="minUsed"></span></div>
      <div class="sub" id="todaySub"></div>
    </div>
    <div class="tile">
      <div class="name" data-i18n="thisWeek"></div>
      <div class="value"><span id="week">–</span> <span class="unit" data-i18n="minUsed"></span></div>
    </div>
  </div>

  <div class="row">
    <div class="status">
      <div class="conn"><span class="dot" id="connDot"></span><span id="conn"></span></div>
      <div class="conn"><span class="dot" id="tvDot"></span><span id="tv"></span></div>
    </div>
    <button class="link" id="reset"></button>
  </div>

  </div>

  <script>
    function onHomeyReady(Homey) {
      var status = null;
      var $ = function (id) { return document.getElementById(id); };
      var strings = {};
      var connKey = { unconfigured: 'connUnconfigured', connecting: 'connNotConnected', prompt: 'connPrompt',
        connected: 'connConnected', offline: 'connNotConnected' };

      // Tekstene kommer fra appen, i Homeys språk. Variabler skrives som __navn__.
      function t(key, vars) {
        var text = strings[key] || key;
        Object.keys(vars || {}).forEach(function (name) { text = text.split('__' + name + '__').join(vars[name]); });
        return text;
      }
      function translateStatic() {
        Array.prototype.forEach.call(document.querySelectorAll('[data-i18n]'), function (el) {
          el.textContent = t(el.getAttribute('data-i18n'));
        });
        $('toggle').setAttribute('aria-label', t('title'));
        $('reset').textContent = t('reset');
        $('reset').title = t('resetTitle');
      }

      function render(s) {
        status = s;
        var total = s.quotaMinutes + s.extraMinutes;
        var low = s.childMode && !s.locked && s.remainingMinutes <= 5;

        $('toggle').setAttribute('aria-checked', String(s.childMode));
        $('state').textContent = t(s.childMode ? (s.locked ? 'stateLocked' : 'stateOn') : 'stateOff');
        $('state').className = 'state' + (s.locked ? ' bad' : s.childMode ? ' good' : '');
        $('body').className = s.childMode ? '' : 'off';
        Array.prototype.forEach.call(document.querySelectorAll('[data-min]'), function (b) { b.disabled = !s.childMode; });
        document.documentElement.classList.toggle('locked', s.locked);
        document.documentElement.classList.toggle('on', s.childMode && !s.locked);

        $('remaining').textContent = s.locked ? t('locked') : t('minutesLeft', { minutes: s.remainingMinutes });
        $('remaining').className = 'big' + (s.locked ? ' locked' : low ? ' low' : '');
        $('bar').className = 'bar' + (s.locked ? ' locked' : low ? ' low' : '');
        $('fill').style.width = (total > 0 ? Math.min(100, Math.round(100 * s.usedMinutes / total)) : 100) + '%';
        $('today').textContent = s.usedMinutes;
        $('todaySub').textContent = t('ofTotal', { total: total }) + (s.extraMinutes ? ' (' + t('inclExtra', { extra: s.extraMinutes }) + ')' : '');
        $('week').textContent = s.weekUsedMinutes;
        var connected = s.connection === 'connected';
        $('connDot').className = 'dot' + (connected ? ' ok' : '');
        $('conn').textContent = t(connKey[s.connection]);
        $('tvDot').className = 'dot' + (connected && s.tvOn ? ' ok' : '');
        $('tv').textContent = t(connected && s.tvOn ? 'tvOn' : 'tvOff');
      }
      function call(method, path, body) {
        return Homey.api(method, path, body || {})
          .then(function (s) { render(s); })
          .catch(function (err) { $('connDot').className = 'dot'; $('tvDot').className = 'dot'; $('conn').textContent = t('error') + ': ' + (err && err.message || err); });
      }
      function refresh() { return call('GET', '/status'); }

      $('toggle').addEventListener('click', function () {
        if (!status) return;
        var on = !status.childMode;
        $('toggle').setAttribute('aria-checked', String(on)); // umiddelbar respons
        call('POST', '/child-mode', { on: on });
      });
      Array.prototype.forEach.call(document.querySelectorAll('[data-min]'), function (b) {
        b.addEventListener('click', function () { call('POST', '/extra-time', { minutes: Number(b.dataset.min) }); });
      });

      var resetTimer = null;
      $('reset').addEventListener('click', function () {
        if (resetTimer) {
          clearTimeout(resetTimer); resetTimer = null;
          $('reset').textContent = t('reset');
          call('POST', '/reset-today');
        } else {
          $('reset').textContent = t('tapAgain');
          resetTimer = setTimeout(function () { resetTimer = null; $('reset').textContent = t('reset'); }, 4000);
        }
      });

      // Høyden måles etter første visning, så innholdet aldri trenger å skrolles.
      Homey.api('GET', '/strings', {})
        .then(function (loaded) { strings = loaded; })
        .catch(function () { /* uten tekster vises nøklene */ })
        .then(function () {
          translateStatic();
          return refresh();
        })
        .then(function () {
          Homey.ready({ height: Math.ceil($('app').offsetHeight) + 32 }); // innhold + 2 × 16 px luft
        });
      setInterval(refresh, 10000);
    }
  </script>
</body>
</html>

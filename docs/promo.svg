<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#202843"/><stop offset="1" stop-color="#3a3e66"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d4034"/><stop offset="1" stop-color="#34241f"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101b38"/><stop offset="1" stop-color="#1d3260"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5399f4"/><stop offset="1" stop-color="#87d23f"/>
    </linearGradient>
    <radialGradient id="tvGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7fb0ff" stop-opacity=".38"/><stop offset="1" stop-color="#7fb0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffcf7a" stop-opacity=".55"/><stop offset="1" stop-color="#ffcf7a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".45"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".55"/>
    </filter>
  </defs>

  <!-- Rom -->
  <rect width="1000" height="700" fill="url(#wall)"/>
  <path d="M0 515 H1000 V700 H0 Z" fill="url(#floor)"/>
  <rect x="0" y="512" width="1000" height="6" fill="#2a1d19" opacity=".6"/>
  <ellipse cx="570" cy="310" rx="430" ry="330" fill="url(#tvGlow)"/>

  <!-- Gulvlampe -->
  <ellipse cx="110" cy="230" rx="190" ry="210" fill="url(#lampGlow)"/>
  <rect x="106" y="226" width="8" height="330" rx="4" fill="#171a29"/>
  <ellipse cx="110" cy="558" rx="46" ry="10" fill="#171a29"/>
  <path d="M74 150 H146 L170 238 H50 Z" fill="#f5cf86"/>
  <path d="M74 150 H146 L170 238 H50 Z" fill="#fff" opacity=".12"/>

  <!-- Mediabenk og plante -->
  <rect x="250" y="500" width="640" height="62" rx="12" fill="#2b2231"/>
  <rect x="280" y="560" width="14" height="40" rx="4" fill="#1d1722"/>
  <rect x="846" y="560" width="14" height="40" rx="4" fill="#1d1722"/>
  <path d="M818 440 H866 L860 500 H824 Z" fill="#c6694b"/>
  <ellipse cx="842" cy="408" rx="16" ry="40" fill="#4f9d58" transform="rotate(-24 842 440)"/>
  <ellipse cx="842" cy="404" rx="16" ry="42" fill="#3f8a4b"/>
  <ellipse cx="842" cy="408" rx="16" ry="40" fill="#5db26a" transform="rotate(26 842 440)"/>

  <!-- TV -->
  <rect x="540" y="468" width="60" height="34" fill="#0b0d16"/>
  <rect x="480" y="496" width="180" height="8" rx="4" fill="#0b0d16"/>
  <rect x="300" y="168" width="540" height="304" rx="20" fill="#0b0d16"/>
  <rect x="312" y="180" width="516" height="280" rx="11" fill="url(#screen)"/>
  <!-- Tidsring på skjermen -->
  <circle cx="570" cy="312" r="84" fill="none" stroke="#fff" stroke-opacity=".12" stroke-width="22"/>
  <circle cx="570" cy="312" r="84" fill="none" stroke="url(#ring)" stroke-width="22" stroke-linecap="round"
          stroke-dasharray="370 528" transform="rotate(-90 570 312)"/>
  <path d="M570 312 V282 M570 312 L592 326" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="480" y="420" width="180" height="12" rx="6" fill="#fff" fill-opacity=".14"/>
  <rect x="480" y="420" width="118" height="12" rx="6" fill="#5399f4"/>

  <!-- Barn i sofaen sett bakfra -->
  <g>
    <ellipse cx="170" cy="566" rx="54" ry="34" fill="#1c1730"/>
    <ellipse cx="306" cy="574" rx="46" ry="30" fill="#1c1730"/>
    <circle cx="170" cy="500" r="37" fill="#1c1730"/>
    <circle cx="170" cy="500" r="37" fill="none" stroke="#8fb8ff" stroke-opacity=".55" stroke-width="3"
            stroke-dasharray="64 170" transform="rotate(-62 170 500)"/>
    <circle cx="306" cy="520" r="31" fill="#1c1730"/>
    <circle cx="306" cy="520" r="31" fill="none" stroke="#8fb8ff" stroke-opacity=".55" stroke-width="3"
            stroke-dasharray="54 142" transform="rotate(-62 306 520)"/>
  </g>
  <!-- Sofa -->
  <rect x="-60" y="548" width="580" height="190" rx="46" fill="#5a3d52"/>
  <rect x="-60" y="548" width="580" height="30" rx="15" fill="#fff" opacity=".07"/>
  <rect x="-10" y="590" width="470" height="150" rx="40" fill="#6b4864"/>

  <!-- Telefon med widgeten: ring med tid igjen, − og + på hver side, intervallvelger og statistikk -->
  <g transform="translate(690 300) rotate(-6)" filter="url(#shadow)">
    <rect x="0" y="0" width="230" height="420" rx="38" fill="#10121b" stroke="#444a63" stroke-width="4"/>
    <rect x="12" y="12" width="206" height="396" rx="28" fill="#1f2028"/>
    <!-- topp: ikon, tittel, status og bryter -->
    <rect x="30" y="38" width="26" height="20" rx="4" fill="none" stroke="#e4e4e7" stroke-width="3"/>
    <circle cx="43" cy="48" r="5" fill="none" stroke="#e4e4e7" stroke-width="2.5"/>
    <rect x="66" y="36" width="64" height="10" rx="5" fill="#e4e4e7"/>
    <rect x="66" y="54" width="44" height="8" rx="4" fill="#87d23f"/>
    <rect x="156" y="36" width="48" height="28" rx="14" fill="#5399f4"/>
    <circle cx="190" cy="50" r="11" fill="#fff"/>
    <!-- ring med tid igjen -->
    <circle cx="115" cy="150" r="40" fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="9"/>
    <circle cx="115" cy="150" r="40" fill="none" stroke="#5399f4" stroke-width="9" stroke-linecap="round"
            stroke-dasharray="156 251" transform="rotate(-90 115 150)"/>
    <rect x="95" y="140" width="40" height="17" rx="8.5" fill="#e4e4e7"/>
    <rect x="103" y="164" width="24" height="6" rx="3" fill="#fff" fill-opacity=".45"/>
    <!-- trekk fra tid (−) og gi tid (+) -->
    <circle cx="44" cy="150" r="19" fill="#f5a623" fill-opacity=".2"/>
    <path d="M37 150 H51" stroke="#f5a623" stroke-width="3.2" stroke-linecap="round"/>
    <circle cx="186" cy="150" r="19" fill="#5399f4" fill-opacity=".2"/>
    <path d="M179 150 H193 M186 143 V157" stroke="#5399f4" stroke-width="3.2" stroke-linecap="round"/>
    <!-- intervall -->
    <rect x="85" y="206" width="60" height="22" rx="11" fill="#fff" fill-opacity=".16"/>
    <rect x="95" y="214" width="26" height="6" rx="3" fill="#fff" fill-opacity=".55"/>
    <path d="M129 215.5 L132 218.5 L135 215.5" fill="none" stroke="#9aa3b2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- statistikk: i dag og denne uka -->
    <rect x="30" y="246" width="82" height="62" rx="16" fill="#fff" fill-opacity=".09"/>
    <rect x="118" y="246" width="82" height="62" rx="16" fill="#fff" fill-opacity=".09"/>
    <rect x="42" y="260" width="34" height="7" rx="3.5" fill="#fff" fill-opacity=".45"/>
    <rect x="42" y="275" width="52" height="15" rx="7.5" fill="#e4e4e7"/>
    <rect x="130" y="260" width="34" height="7" rx="3.5" fill="#fff" fill-opacity=".45"/>
    <rect x="130" y="275" width="52" height="15" rx="7.5" fill="#e4e4e7"/>
    <!-- status -->
    <circle cx="36" cy="338" r="5" fill="#87d23f"/>
    <rect x="48" y="334" width="44" height="8" rx="4" fill="#fff" fill-opacity=".45"/>
    <circle cx="112" cy="338" r="5" fill="#87d23f"/>
    <rect x="124" y="334" width="30" height="8" rx="4" fill="#fff" fill-opacity=".45"/>
  </g>

  <rect width="1000" height="700" fill="url(#vignette)"/>
</svg>
